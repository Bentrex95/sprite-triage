# The public demo on Fly.io (simulated API, no token). The host name follows from the
# app name. One machine is enough; the secret keeps sessions valid across restarts:
#   fly launch --copy-config --no-deploy
#   fly secrets set SECRET_KEY_BASE="$(openssl rand -base64 48)"
#   fly deploy --ha=false
primary_region = "fra"

[http_service]
  internal_port = 4090
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
